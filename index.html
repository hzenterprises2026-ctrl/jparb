<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PyeProfit - John Pye to eBay Arbitrage Finder</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Fallback Mock Data if Scraper Backend is Offline
    const initialListings = [
      {
        id: "jp-101",
        title: "Apple Watch Series 8 GPS 45mm Midnight Aluminum (Ex-Display)",
        currentBid: 65.00,
        estimatedEbay: 220.00,
        postageCost: 6.50,
        auctionEnd: "2h 15m",
        link: "https://www.johnpye.co.uk/",
        category: "Tech"
      },
      {
        id: "jp-102",
        title: "Ninja Foodi Max Dual Zone Air Fryer AF400UK (Customer Return)",
        currentBid: 45.00,
        estimatedEbay: 150.00,
        postageCost: 8.50,
        auctionEnd: "4h 30m",
        link: "https://www.johnpye.co.uk/",
        category: "Home & Kitchen"
      },
      {
        id: "jp-103",
        title: "DeWalt 18V XR Brushless Combi Drill Kit dcd796",
        currentBid: 30.00,
        estimatedEbay: 110.00,
        postageCost: 7.00,
        auctionEnd: "1h 05m",
        link: "https://www.johnpye.co.uk/",
        category: "Tools"
      },
      {
        id: "jp-104",
        title: "Sony WH-1000XM5 Noise Cancelling Headphones - Black",
        currentBid: 85.00,
        estimatedEbay: 240.00,
        postageCost: 5.50,
        auctionEnd: "5h 45m",
        link: "https://www.johnpye.co.uk/",
        category: "Tech"
      }
    ];

    function App() {
      const [listings, setListings] = useState([]);
      const [loading, setLoading] = useState(true);
      const [usingFallback, setUsingFallback] = useState(false);

      const [minMargin, setMinMargin] = useState(20);
      const [searchTerm, setSearchTerm] = useState("");
      const [selectedCategory, setSelectedCategory] = useState("All");

      // Backend API URL (Points to local server during development)
      const BACKEND_URL = 'http://localhost:3001/api/scrape-johnpye';

      // Fetch Live Auctions from Scraper Backend
      const fetchLiveListings = async () => {
        setLoading(true);
        setUsingFallback(false);
        try {
          const response = await fetch(BACKEND_URL);
          if (!response.ok) throw new Error('Scraper backend unreachable');
          
          const result = await response.json();
          
          if (result.success && result.data && result.data.length > 0) {
            setListings(result.data);
          } else {
            throw new Error('No items returned from backend');
          }
        } catch (err) {
          console.warn('Scraper backend offline, loading fallback mock data:', err.message);
          setListings(initialListings);
          setUsingFallback(true);
        } finally {
          setLoading(false);
        }
      };

      // Auto-fetch on initial render
      useEffect(() => {
        fetchLiveListings();
      }, []);

      // Calculate Net Profit considering John Pye Fees & eBay Fees
      const calculateBreakdown = (bid, ebayPrice, postage = 6.50) => {
        // John Pye Fees: 25% Premium + 20% VAT on Premium + £3.00 Lot Fee
        const buyersPremium = bid * 0.25;
        const vatOnPremium = buyersPremium * 0.20;
        const lotFee = 3.00;
        const totalJohnPyeCost = bid + buyersPremium + vatOnPremium + lotFee;

        // eBay Fees: ~12.8% + 30p fixed fee
        const ebayFees = (ebayPrice * 0.128) + 0.30;
        const netEbayRevenue = ebayPrice - ebayFees - postage;

        const netProfit = netEbayRevenue - totalJohnPyeCost;
        const profitMargin = totalJohnPyeCost > 0 ? (netProfit / totalJohnPyeCost) * 100 : 0;

        return {
          totalCost: totalJohnPyeCost.toFixed(2),
          ebayFees: ebayFees.toFixed(2),
          netProfit: netProfit.toFixed(2),
          profitMargin: profitMargin.toFixed(1)
        };
      };

      const filteredListings = listings.filter(item => {
        const breakdown = calculateBreakdown(item.currentBid, item.estimatedEbay, item.postageCost);
        const matchesMargin = parseFloat(breakdown.profitMargin) >= minMargin;
        const matchesSearch = item.title.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCategory = selectedCategory === "All" || item.category === selectedCategory || item.category === "Auction Lot";
        return matchesMargin && matchesSearch && matchesCategory;
      });

      return (
        <div className="min-h-screen p-6 max-w-7xl mx-auto">
          {/* Header */}
          <header className="flex flex-col md:flex-row justify-between items-center mb-6 bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <div>
              <h1 className="text-3xl font-bold text-emerald-400 flex items-center gap-2">
                <span>⚡ PyeProfit</span>
              </h1>
              <p className="text-slate-400 text-sm mt-1">John Pye Auctions ➔ eBay Arbitrage Dashboard</p>
            </div>
            
            <div className="mt-4 md:mt-0 flex items-center gap-4">
              <div className="bg-slate-900 px-4 py-2 rounded-lg border border-slate-700 text-center">
                <span className="text-xs text-slate-400 block">Matches Found</span>
                <span className="text-xl font-bold text-white">{filteredListings.length}</span>
              </div>
              <button 
                onClick={fetchLiveListings} 
                disabled={loading}
                className="bg-emerald-500 hover:bg-emerald-600 disabled:bg-slate-700 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-sm transition flex items-center gap-2"
              >
                {loading ? '↻ Syncing...' : '🔄 Sync Live Auctions'}
              </button>
            </div>
          </header>

          {/* Status Indicator Bar */}
          {usingFallback && !loading && (
            <div className="mb-6 p-4 bg-amber-500/10 border border-amber-500/30 rounded-lg text-amber-300 text-xs flex justify-between items-center">
              <span>⚠️ <strong>Backend Offline:</strong> Displaying static fallback data. Start your Node.js backend (<code>node server.js</code>) on port 3001 to pull live items.</span>
              <button onClick={fetchLiveListings} className="underline hover:text-amber-100">Retry Connection</button>
            </div>
          )}

          {/* Controls / Filters */}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div className="bg-slate-800 p-4 rounded-lg border border-slate-700">
              <label className="text-xs text-slate-400 block mb-1">Search Lot Title</label>
              <input
                type="text"
                placeholder="Search Apple, DeWalt, Air Fryer..."
                className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
              />
            </div>

            <div className="bg-slate-800 p-4 rounded-lg border border-slate-700">
              <label className="text-xs text-slate-400 block mb-1">Min Profit Margin Target: <span className="text-emerald-400 font-bold">{minMargin}%</span></label>
              <input
                type="range"
                min="0"
                max="100"
                value={minMargin}
                onChange={(e) => setMinMargin(Number(e.target.value))}
                className="w-full accent-emerald-500 cursor-pointer"
              />
            </div>

            <div className="bg-slate-800 p-4 rounded-lg border border-slate-700">
              <label className="text-xs text-slate-400 block mb-1">Category Filter</label>
              <select
                className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500"
                value={selectedCategory}
                onChange={(e) => setSelectedCategory(e.target.value)}
              >
                <option value="All">All Categories</option>
                <option value="Auction Lot">Live Auction Lots</option>
                <option value="Tech">Tech & Gadgets</option>
                <option value="Home & Kitchen">Home & Kitchen</option>
                <option value="Tools">Tools & DIY</option>
              </select>
            </div>
          </div>

          {/* Loading Spinner State */}
          {loading && (
            <div className="text-center py-16 bg-slate-800/50 rounded-xl border border-slate-700 mb-6">
              <div className="inline-block animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent mb-3"></div>
              <p className="text-slate-300 font-medium text-sm">Launching stealth browser and scraping live John Pye auction lots...</p>
              <p className="text-slate-500 text-xs mt-1">This typically takes 5–10 seconds</p>
            </div>
          )}

          {/* Cards Grid */}
          {!loading && (
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-6">
              {filteredListings.length === 0 ? (
                <div className="col-span-full text-center py-12 bg-slate-800/30 rounded-xl border border-slate-700/50 text-slate-400">
                  No auction lots met your profit margin filter ({minMargin}%) or search criteria.
                </div>
              ) : (
                filteredListings.map((item) => {
                  const breakdown = calculateBreakdown(item.currentBid, item.estimatedEbay, item.postageCost);
                  const isHighProfit = parseFloat(breakdown.profitMargin) >= 30;

                  return (
                    <div key={item.id} className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-md flex flex-col justify-between hover:border-slate-500 transition">
                      <div className="p-5">
                        <div className="flex justify-between items-start mb-2">
                          <span className="text-xs font-semibold px-2.5 py-1 rounded bg-slate-700 text-slate-300">
                            {item.category || 'Auction Lot'}
                          </span>
                          <span className="text-xs font-medium text-amber-400 bg-amber-400/10 px-2 py-0.5 rounded">
                            Ends: {item.auctionEnd || 'Today'}
                          </span>
                        </div>

                        <h2 className="text-lg font-semibold text-white mb-4 line-clamp-2">{item.title}</h2>

                        {/* Pricing Metrics Grid */}
                        <div className="grid grid-cols-3 gap-2 bg-slate-900/60 p-3 rounded-lg border border-slate-700/50 text-center mb-4">
                          <div>
                            <span className="text-[10px] text-slate-400 block uppercase">Current Bid</span>
                            <span className="text-base font-bold text-white">£{item.currentBid.toFixed(2)}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 block uppercase">True Landed Cost</span>
                            <span className="text-base font-bold text-slate-300">£{breakdown.totalCost}</span>
                          </div>
                          <div>
                            <span className="text-[10px] text-slate-400 block uppercase">Est. eBay Resale</span>
                            <span className="text-base font-bold text-blue-400">£{item.estimatedEbay.toFixed(2)}</span>
                          </div>
                        </div>

                        {/* Cost Itemization */}
                        <div className="space-y-1 text-xs text-slate-400 mb-2 px-1">
                          <div className="flex justify-between">
                            <span>John Pye Fees (25% + VAT + £3 Lot Fee):</span>
                            <span className="text-slate-300">£{(parseFloat(breakdown.totalCost) - item.currentBid).toFixed(2)}</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Est. eBay Fees (~12.8% + 30p):</span>
                            <span className="text-slate-300">£{breakdown.ebayFees}</span>
                          </div>
                        </div>
                      </div>

                      {/* Profit Banner Footer */}
                      <div className={`p-4 flex items-center justify-between border-t ${
                        isHighProfit ? 'bg-emerald-950/40 border-emerald-800/50' : 'bg-slate-800/80 border-slate-700'
                      }`}>
                        <div>
                          <span className="text-xs text-slate-400 block">Est. Net Profit</span>
                          <span className={`text-xl font-black ${isHighProfit ? 'text-emerald-400' : 'text-slate-200'}`}>
                            +£{breakdown.netProfit} <span className="text-xs font-normal">({breakdown.profitMargin}%)</span>
                          </span>
                        </div>
                        <a
                          href={item.link}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition"
                        >
                          Bid on John Pye
                        </a>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
